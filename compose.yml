services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    container_name: dev-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config:/etc/traefik/config:ro
    networks:
      - dev-proxy

networks:
  dev-proxy:
    name: dev-proxy
